<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 400" width="500" height="400" style="background:#ffffff;">
  <defs>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.08"/>
    </filter>
    <linearGradient id="tealGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#14a2a8"/>
      <stop offset="100%" stop-color="#0e7c82"/>
    </linearGradient>
    <linearGradient id="scrubPants" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d6368"/>
      <stop offset="100%" stop-color="#08474b"/>
    </linearGradient>
  </defs>

  <!-- Clean Ground Baseline -->
  <line x1="40" y1="340" x2="460" y2="340" stroke="#e2e8f0" stroke-width="3" stroke-linecap="round"/>

  <!-- Main Illustration Group -->
  <g transform="translate(0, 10)">
    
  <!-- Patient with loose sterile eye pad placed -->
  <circle cx="190" cy="170" r="26" fill="#ffedd5" stroke="#1e293b" stroke-width="2.5"/>
  <!-- Sterile eye pad on affected eye -->
  <ellipse cx="202" cy="168" rx="10" ry="12" fill="#ffffff" stroke="#64748b" stroke-width="2"/>
  <line x1="188" y1="168" x2="216" y2="168" stroke="#cbd5e1" stroke-width="3"/>
  <!-- Rescuer securing with paper tape -->
  <circle cx="120" cy="130" r="24" fill="#ffedd5" stroke="#1e293b" stroke-width="2.5"/>
  <path d="M120,155 L120,240" fill="none" stroke="url(#tealGrad)" stroke-width="28" stroke-linecap="round"/>
  <path d="M120,240 L100,335 M140,240 L160,335" fill="none" stroke="url(#scrubPants)" stroke-width="12" stroke-linecap="round"/>
  <path d="M130,170 L170,168 L195,168" fill="none" stroke="url(#tealGrad)" stroke-width="10" stroke-linecap="round"/>
  <!-- Caution: DO NOT RUB EYE -->
  <rect x="270" y="150" width="180" height="46" rx="8" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/>
  <text x="280" y="170" font-size="11" font-weight="800" fill="#dc2626">DO NOT RUB THE EYE</text>
  <text x="280" y="186" font-size="9" font-weight="600" fill="#7f1d1d">Cover loosely &amp; seek ophthalmologist</text>

  </g>

  <!-- Professional Clinical Status Tag -->
  <rect x="25" y="20" width="14" height="14" rx="4" fill="#119197"/>
  <text x="46" y="32" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700" fill="#0f766e" letter-spacing="0.3">STAGE 2: LOOSE STERILE EYE SHIELD</text>
  <text x="46" y="48" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="500" fill="#64748b">Cover eye loosely with sterile pad; do not apply pressure or rub; transport to medical care</text>
</svg>