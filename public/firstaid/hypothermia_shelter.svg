<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 400" width="500" height="400" style="background:#ffffff;">
  <defs>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.08"/>
    </filter>
    <linearGradient id="tealGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#14a2a8"/>
      <stop offset="100%" stop-color="#0e7c82"/>
    </linearGradient>
    <linearGradient id="scrubPants" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d6368"/>
      <stop offset="100%" stop-color="#08474b"/>
    </linearGradient>
  </defs>

  <!-- Clean Ground Baseline -->
  <line x1="40" y1="340" x2="460" y2="340" stroke="#e2e8f0" stroke-width="3" stroke-linecap="round"/>

  <!-- Main Illustration Group -->
  <g transform="translate(0, 10)">
    
  <!-- Victim insulated off cold ground with sleeping pad -->
  <rect x="70" y="300" width="280" height="16" rx="4" fill="#3b82f6" stroke="#1d4ed8" stroke-width="2"/>
  <text x="140" y="312" font-size="9" font-weight="700" fill="#ffffff">INSULATING GROUND FOAM MAT</text>
  <!-- Victim fully bundled -->
  <circle cx="100" cy="270" r="20" fill="#ffedd5" stroke="#1e293b" stroke-width="2.5"/>
  <path d="M115,275 L310,275" fill="none" stroke="#dc2626" stroke-width="28" stroke-linecap="round"/>
  <!-- Rescuer offering warm sweet mug -->
  <circle cx="250" cy="140" r="24" fill="#ffedd5" stroke="#1e293b" stroke-width="2.5"/>
  <path d="M250,165 L250,245" fill="none" stroke="url(#tealGrad)" stroke-width="28" stroke-linecap="round"/>
  <path d="M250,245 L230,335 M265,245 L290,335" fill="none" stroke="url(#scrubPants)" stroke-width="12" stroke-linecap="round"/>
  <path d="M240,180 L180,185 L140,210" fill="none" stroke="url(#tealGrad)" stroke-width="10" stroke-linecap="round"/>
  <!-- Warm mug with steam -->
  <rect x="135" y="200" width="16" height="20" rx="3" fill="#f8fafc" stroke="#64748b" stroke-width="2"/>
  <path d="M151,205 C156,205 156,215 151,215" fill="none" stroke="#64748b" stroke-width="2"/>
  <path d="M140,192 Q143,185 140,178 M146,192 Q149,185 146,178" fill="none" stroke="#f97316" stroke-width="1.5" stroke-linecap="round"/>

  </g>

  <!-- Professional Clinical Status Tag -->
  <rect x="25" y="20" width="14" height="14" rx="4" fill="#119197"/>
  <text x="46" y="32" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700" fill="#0f766e" letter-spacing="0.3">STAGE 2: GROUND INSULATION &amp; WARM LIQUIDS</text>
  <text x="46" y="48" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="500" fill="#64748b">Insulate victim off cold ground; administer warm sweet liquids if fully awake</text>
</svg>