<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 400" width="500" height="400" style="background:#ffffff;">
  <defs>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.08"/>
    </filter>
    <linearGradient id="tealGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#14a2a8"/>
      <stop offset="100%" stop-color="#0e7c82"/>
    </linearGradient>
    <linearGradient id="scrubPants" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d6368"/>
      <stop offset="100%" stop-color="#08474b"/>
    </linearGradient>
  </defs>

  <!-- Clean Ground Baseline -->
  <line x1="40" y1="340" x2="460" y2="340" stroke="#e2e8f0" stroke-width="3" stroke-linecap="round"/>

  <!-- Main Illustration Group -->
  <g transform="translate(0, 10)">
    
  <!-- Supine victim motionless -->
  <circle cx="130" cy="290" r="24" fill="#ffedd5" stroke="#1e293b" stroke-width="2.5"/>
  <path d="M155,295 L360,295" fill="none" stroke="#64748b" stroke-width="24" stroke-linecap="round"/>
  <!-- Rescuer kneeling directly at victim's head -->
  <circle cx="70" cy="190" r="24" fill="#ffedd5" stroke="#1e293b" stroke-width="2.5"/>
  <path d="M70,215 L70,290" fill="none" stroke="url(#tealGrad)" stroke-width="28" stroke-linecap="round"/>
  <path d="M70,290 L50,335 M85,290 L100,335" fill="none" stroke="url(#scrubPants)" stroke-width="12" stroke-linecap="round"/>
  <!-- Rescuer's two hands firmly gripping sides of victim's head/neck -->
  <path d="M80,230 L115,250 L125,275" fill="none" stroke="url(#tealGrad)" stroke-width="10" stroke-linecap="round"/>
  <path d="M80,230 L115,270 L135,275" fill="none" stroke="url(#tealGrad)" stroke-width="10" stroke-linecap="round"/>
  <ellipse cx="130" cy="275" rx="14" ry="7" fill="#ffedd5" stroke="#1e293b" stroke-width="2"/>
  <!-- Neutral alignment axis line -->
  <line x1="85" y1="295" x2="380" y2="295" stroke="#ef4444" stroke-width="2" stroke-dasharray="4 4"/>
  <rect x="230" y="170" width="180" height="46" rx="8" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/>
  <text x="240" y="190" font-size="11" font-weight="800" fill="#dc2626">MANUAL CERVICAL HOLD</text>
  <text x="240" y="206" font-size="9" font-weight="600" fill="#7f1d1d">Keep head, neck &amp; torso strictly aligned</text>

  </g>

  <!-- Professional Clinical Status Tag -->
  <rect x="25" y="20" width="14" height="14" rx="4" fill="#119197"/>
  <text x="46" y="32" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700" fill="#0f766e" letter-spacing="0.3">STAGE 1: MANUAL IN-LINE CERVICAL STABILIZATION</text>
  <text x="46" y="48" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="500" fill="#64748b">Kneel at head and hold victim's head firmly in neutral alignment; eliminate all movement</text>
</svg>