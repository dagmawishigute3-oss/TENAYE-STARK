<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 400" width="500" height="400" style="background:#ffffff;">
  <defs>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.08"/>
    </filter>
    <linearGradient id="tealGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#14a2a8"/>
      <stop offset="100%" stop-color="#0e7c82"/>
    </linearGradient>
    <linearGradient id="scrubPants" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d6368"/>
      <stop offset="100%" stop-color="#08474b"/>
    </linearGradient>
  </defs>

  <!-- Clean Ground Baseline -->
  <line x1="40" y1="340" x2="460" y2="340" stroke="#e2e8f0" stroke-width="3" stroke-linecap="round"/>

  <!-- Main Illustration Group -->
  <g transform="translate(0, 10)">
    
  <!-- Patient leaning over basin tilting head to affected side -->
  <circle cx="190" cy="170" r="24" fill="#ffedd5" stroke="#1e293b" stroke-width="2.5"/>
  <path d="M205,190 L260,240 L310,335" fill="none" stroke="#64748b" stroke-width="20" stroke-linecap="round"/>
  <!-- Rescuer holding eyelids open and flushing with water stream -->
  <circle cx="130" cy="110" r="24" fill="#ffedd5" stroke="#1e293b" stroke-width="2.5"/>
  <path d="M130,135 L130,230" fill="none" stroke="url(#tealGrad)" stroke-width="28" stroke-linecap="round"/>
  <path d="M130,230 L110,335 M150,230 L170,335" fill="none" stroke="url(#scrubPants)" stroke-width="12" stroke-linecap="round"/>
  <path d="M140,160 L180,165" fill="none" stroke="url(#tealGrad)" stroke-width="10" stroke-linecap="round"/>
  <!-- Saline flush bottle with steady water stream -->
  <rect x="155" y="120" width="16" height="28" rx="3" fill="#bae6fd" stroke="#0284c7" stroke-width="2"/>
  <!-- Water jet flowing across eye from inner to outer corner -->
  <path d="M165,148 Q180,160 195,170" fill="none" stroke="#0284c7" stroke-width="3" stroke-linecap="round"/>
  <!-- Drainage runoff basin -->
  <path d="M170,220 C170,250 230,250 230,220 Z" fill="#e2e8f0" stroke="#64748b" stroke-width="2"/>

  </g>

  <!-- Professional Clinical Status Tag -->
  <rect x="25" y="20" width="14" height="14" rx="4" fill="#119197"/>
  <text x="46" y="32" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700" fill="#0f766e" letter-spacing="0.3">STAGE 1: CONTINUOUS 15-MINUTE IRRIGATION</text>
  <text x="46" y="48" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="500" fill="#64748b">Tilt head toward injured eye; hold eyelids open and flush gently from inner to outer corner</text>
</svg>