<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 400" width="500" height="400" style="background:#ffffff;">
  <defs>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.08"/>
    </filter>
    <linearGradient id="tealGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#14a2a8"/>
      <stop offset="100%" stop-color="#0e7c82"/>
    </linearGradient>
    <linearGradient id="scrubPants" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d6368"/>
      <stop offset="100%" stop-color="#08474b"/>
    </linearGradient>
  </defs>

  <!-- Clean Ground Baseline -->
  <line x1="40" y1="340" x2="460" y2="340" stroke="#e2e8f0" stroke-width="3" stroke-linecap="round"/>

  <!-- Main Illustration Group -->
  <g transform="translate(0, 10)">
    
  <!-- Chair -->
  <path d="M160,220 L160,340 M230,250 L230,340 M150,150 L160,240 L230,240" fill="none" stroke="#94a3b8" stroke-width="4" stroke-linecap="round"/>
  <!-- Patient seated leaning forward -->
  <path d="M170,240 L210,240 L220,335" fill="none" stroke="#1e293b" stroke-width="14" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Torso leaning forward -->
  <path d="M185,235 L245,160" fill="none" stroke="#0284c7" stroke-width="26" stroke-linecap="round"/>
  <!-- Head tilted forward -->
  <circle cx="270" cy="130" r="28" fill="#ffedd5" stroke="#1e293b" stroke-width="3"/>
  <!-- Nose and eyes facing forward-down -->
  <path d="M285,130 L298,142 L288,145" fill="none" stroke="#1e293b" stroke-width="2.5" stroke-linecap="round"/>
  <circle cx="278" cy="122" r="2.5" fill="#1e293b"/>
  <!-- Arm reaching up pinching soft nose -->
  <path d="M245,170 L280,185 L292,145" fill="none" stroke="#ffedd5" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M245,170 L280,185 L292,145" fill="none" stroke="#1e293b" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Pinch Indicator Clamp Arrow -->
  <path d="M308,135 L300,143 M308,153 L300,145" fill="none" stroke="#ef4444" stroke-width="3" stroke-linecap="round"/>
  <circle cx="318" cy="144" r="14" fill="#fee2e2" stroke="#ef4444" stroke-width="2"/>
  <text x="313" y="148" font-size="11" font-weight="800" fill="#dc2626">10m</text>
  <!-- Rescuer in Tenaye Teal supporting -->
  <circle cx="380" cy="115" r="24" fill="#ffedd5" stroke="#1e293b" stroke-width="2.5"/>
  <path d="M380,140 L380,240" fill="none" stroke="url(#tealGrad)" stroke-width="28" stroke-linecap="round"/>
  <path d="M380,240 L365,335 M395,240 L405,335" fill="none" stroke="url(#scrubPants)" stroke-width="12" stroke-linecap="round"/>
  <path d="M370,160 L320,175 L280,165" fill="none" stroke="url(#tealGrad)" stroke-width="10" stroke-linecap="round"/>
  <!-- Bowl/basin below nose -->
  <path d="M275,220 C275,250 325,250 325,220 Z" fill="#e2e8f0" stroke="#64748b" stroke-width="2.5"/>

  </g>

  <!-- Professional Clinical Status Tag -->
  <rect x="25" y="20" width="14" height="14" rx="4" fill="#119197"/>
  <text x="46" y="32" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700" fill="#0f766e" letter-spacing="0.3">STAGE 1: LEAN FORWARD &amp; PINCH NOSE</text>
  <text x="46" y="48" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="500" fill="#64748b">Firmly squeeze soft fleshy nostrils shut for 10-15 minutes</text>
</svg>