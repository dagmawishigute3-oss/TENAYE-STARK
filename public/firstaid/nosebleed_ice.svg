<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 400" width="500" height="400" style="background:#ffffff;">
  <defs>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.08"/>
    </filter>
    <linearGradient id="tealGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#14a2a8"/>
      <stop offset="100%" stop-color="#0e7c82"/>
    </linearGradient>
    <linearGradient id="scrubPants" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d6368"/>
      <stop offset="100%" stop-color="#08474b"/>
    </linearGradient>
  </defs>

  <!-- Clean Ground Baseline -->
  <line x1="40" y1="340" x2="460" y2="340" stroke="#e2e8f0" stroke-width="3" stroke-linecap="round"/>

  <!-- Main Illustration Group -->
  <g transform="translate(0, 10)">
    
  <!-- Chair &amp; Patient leaning -->
  <path d="M160,220 L160,340 M230,250 L230,340 M150,150 L160,240 L230,240" fill="none" stroke="#94a3b8" stroke-width="4" stroke-linecap="round"/>
  <path d="M170,240 L210,240 L220,335" fill="none" stroke="#1e293b" stroke-width="14" stroke-linecap="round"/>
  <path d="M185,235 L245,160" fill="none" stroke="#0284c7" stroke-width="26" stroke-linecap="round"/>
  <circle cx="270" cy="130" r="28" fill="#ffedd5" stroke="#1e293b" stroke-width="3"/>
  <path d="M285,130 L298,142 L288,145" fill="none" stroke="#1e293b" stroke-width="2.5"/>
  <!-- Rescuer in Tenaye teal applying cold ice pack -->
  <circle cx="370" cy="110" r="24" fill="#ffedd5" stroke="#1e293b" stroke-width="2.5"/>
  <path d="M370,135 L370,230" fill="none" stroke="url(#tealGrad)" stroke-width="28" stroke-linecap="round"/>
  <path d="M370,230 L355,335 M385,230 L395,335" fill="none" stroke="url(#scrubPants)" stroke-width="12" stroke-linecap="round"/>
  <!-- Arm holding cold pack to bridge of nose -->
  <path d="M360,155 L310,140 L290,132" fill="none" stroke="url(#tealGrad)" stroke-width="10" stroke-linecap="round"/>
  <!-- Ice pack in cloth -->
  <rect x="282" y="122" width="22" height="18" rx="4" fill="#38bdf8" stroke="#0284c7" stroke-width="2.5"/>
  <path d="M287,127 L299,135 M299,127 L287,135" stroke="#ffffff" stroke-width="1.5"/>
  <!-- Cooling waves -->
  <path d="M272,112 Q282,108 292,112 M275,104 Q285,100 295,104" fill="none" stroke="#0ea5e9" stroke-width="2" stroke-linecap="round"/>

  </g>

  <!-- Professional Clinical Status Tag -->
  <rect x="25" y="20" width="14" height="14" rx="4" fill="#119197"/>
  <text x="46" y="32" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700" fill="#0f766e" letter-spacing="0.3">STAGE 2: COLD ICE COMPRESS TO BRIDGE</text>
  <text x="46" y="48" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="500" fill="#64748b">Apply wrapped ice pack across nasal bridge to constrict local arterioles</text>
</svg>