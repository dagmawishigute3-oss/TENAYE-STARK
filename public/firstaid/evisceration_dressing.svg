<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 400" width="500" height="400" style="background:#ffffff;">
  <defs>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.08"/>
    </filter>
    <linearGradient id="tealGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#14a2a8"/>
      <stop offset="100%" stop-color="#0e7c82"/>
    </linearGradient>
    <linearGradient id="scrubPants" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d6368"/>
      <stop offset="100%" stop-color="#08474b"/>
    </linearGradient>
  </defs>

  <!-- Clean Ground Baseline -->
  <line x1="40" y1="340" x2="460" y2="340" stroke="#e2e8f0" stroke-width="3" stroke-linecap="round"/>

  <!-- Main Illustration Group -->
  <g transform="translate(0, 10)">
    
  <!-- Supine victim with bent knees -->
  <circle cx="100" cy="285" r="22" fill="#ffedd5" stroke="#1e293b" stroke-width="2.5"/>
  <path d="M120,295 L220,295" fill="none" stroke="#64748b" stroke-width="24" stroke-linecap="round"/>
  <path d="M220,295 L260,230 L300,320" fill="none" stroke="#1e293b" stroke-width="14" stroke-linecap="round"/>
  <!-- Moist sterile dressing loosely draped over abdomen -->
  <ellipse cx="175" cy="290" rx="22" ry="12" fill="#bae6fd" stroke="#0284c7" stroke-width="2.5"/>
  <!-- Rescuer applying sterile saline dressing -->
  <circle cx="210" cy="140" r="24" fill="#ffedd5" stroke="#1e293b" stroke-width="2.5"/>
  <path d="M210,165 L210,245" fill="none" stroke="url(#tealGrad)" stroke-width="28" stroke-linecap="round"/>
  <path d="M210,245 L190,335 M230,245 L260,335" fill="none" stroke="url(#scrubPants)" stroke-width="12" stroke-linecap="round"/>
  <path d="M200,180 L180,230 L175,275" fill="none" stroke="url(#tealGrad)" stroke-width="10" stroke-linecap="round"/>
  <!-- Warning badge: NEVER PUSH ORGANS BACK -->
  <rect x="280" y="150" width="180" height="46" rx="8" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/>
  <text x="290" y="170" font-size="11" font-weight="800" fill="#dc2626">DO NOT PUSH ORGANS IN</text>
  <text x="290" y="186" font-size="9" font-weight="600" fill="#7f1d1d">Drape moist sterile gauze loosely</text>

  </g>

  <!-- Professional Clinical Status Tag -->
  <rect x="25" y="20" width="14" height="14" rx="4" fill="#119197"/>
  <text x="46" y="32" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700" fill="#0f766e" letter-spacing="0.3">STAGE 2: MOIST STERILE SALINE DRAPING</text>
  <text x="46" y="48" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="500" fill="#64748b">Saturate sterile gauze in saline; drape loosely over organs; NEVER push organs back into abdomen</text>
</svg>