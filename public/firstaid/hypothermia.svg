<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 400" width="500" height="400" style="background:#ffffff;">
  <defs>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.08"/>
    </filter>
    <linearGradient id="tealGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#14a2a8"/>
      <stop offset="100%" stop-color="#0e7c82"/>
    </linearGradient>
    <linearGradient id="scrubPants" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d6368"/>
      <stop offset="100%" stop-color="#08474b"/>
    </linearGradient>
  </defs>

  <!-- Clean Ground Baseline -->
  <line x1="40" y1="340" x2="460" y2="340" stroke="#e2e8f0" stroke-width="3" stroke-linecap="round"/>

  <!-- Main Illustration Group -->
  <g transform="translate(0, 10)">
    
  <!-- Victim on floor wrapped in blankets -->
  <circle cx="110" cy="270" r="22" fill="#ffedd5" stroke="#1e293b" stroke-width="2.5"/>
  <!-- Thermal Sleeping Bag / Space Blanket -->
  <path d="M125,280 L320,280" fill="none" stroke="#f59e0b" stroke-width="32" stroke-linecap="round"/>
  <path d="M125,280 L320,280" fill="none" stroke="#fde68a" stroke-width="24" stroke-linecap="round"/>
  <!-- Rescuer tucking blanket around victim -->
  <circle cx="230" cy="140" r="24" fill="#ffedd5" stroke="#1e293b" stroke-width="2.5"/>
  <path d="M230,165 L230,250" fill="none" stroke="url(#tealGrad)" stroke-width="28" stroke-linecap="round"/>
  <path d="M230,250 L200,335 M245,250 L280,335" fill="none" stroke="url(#scrubPants)" stroke-width="12" stroke-linecap="round"/>
  <path d="M220,185 L180,210 L140,260" fill="none" stroke="url(#tealGrad)" stroke-width="10" stroke-linecap="round"/>
  <path d="M240,185 L260,220 L270,265" fill="none" stroke="url(#tealGrad)" stroke-width="10" stroke-linecap="round"/>
  <!-- Warmth radiation waves -->
  <path d="M160,250 Q220,240 280,250" fill="none" stroke="#f97316" stroke-width="2.5" stroke-linecap="round"/>

  </g>

  <!-- Professional Clinical Status Tag -->
  <rect x="25" y="20" width="14" height="14" rx="4" fill="#119197"/>
  <text x="46" y="32" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700" fill="#0f766e" letter-spacing="0.3">STAGE 1: INSULATE CORE &amp; THERMAL BLANKET</text>
  <text x="46" y="48" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="500" fill="#64748b">Remove wet clothes immediately; cocoon victim completely in multi-layer blankets</text>
</svg>