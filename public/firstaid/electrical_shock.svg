<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 400" width="500" height="400" style="background:#ffffff;">
  <defs>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.08"/>
    </filter>
    <linearGradient id="tealGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#14a2a8"/>
      <stop offset="100%" stop-color="#0e7c82"/>
    </linearGradient>
    <linearGradient id="scrubPants" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d6368"/>
      <stop offset="100%" stop-color="#08474b"/>
    </linearGradient>
  </defs>

  <!-- Clean Ground Baseline -->
  <line x1="40" y1="340" x2="460" y2="340" stroke="#e2e8f0" stroke-width="3" stroke-linecap="round"/>

  <!-- Main Illustration Group -->
  <g transform="translate(0, 10)">
    
  <!-- Unresponsive victim near live electrical wire -->
  <circle cx="110" cy="285" r="22" fill="#ffedd5" stroke="#1e293b" stroke-width="2.5"/>
  <path d="M130,295 L300,295" fill="none" stroke="#64748b" stroke-width="24" stroke-linecap="round"/>
  <!-- Live electrical wire with sparks -->
  <path d="M160,250 Q180,270 200,290" fill="none" stroke="#dc2626" stroke-width="4" stroke-linecap="round"/>
  <polygon points="195,280 205,285 200,295 210,290 195,305 200,295" fill="#f59e0b"/>
  <!-- Rescuer using long dry wooden broomstick to push wire away -->
  <circle cx="370" cy="140" r="24" fill="#ffedd5" stroke="#1e293b" stroke-width="2.5"/>
  <path d="M370,165 L370,250" fill="none" stroke="url(#tealGrad)" stroke-width="28" stroke-linecap="round"/>
  <path d="M370,250 L350,335 M385,250 L410,335" fill="none" stroke="url(#scrubPants)" stroke-width="12" stroke-linecap="round"/>
  <!-- Wooden pole -->
  <line x1="360" y1="185" x2="190" y2="280" stroke="#b45309" stroke-width="8" stroke-linecap="round"/>
  <rect x="230" y="130" width="180" height="46" rx="8" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/>
  <text x="240" y="150" font-size="11" font-weight="800" fill="#dc2626">DO NOT TOUCH DIRECTLY</text>
  <text x="240" y="166" font-size="9" font-weight="600" fill="#7f1d1d">Use dry non-conductive wood or plastic</text>

  </g>

  <!-- Professional Clinical Status Tag -->
  <rect x="25" y="20" width="14" height="14" rx="4" fill="#119197"/>
  <text x="46" y="32" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700" fill="#0f766e" letter-spacing="0.3">STAGE 1: ISOLATE POWER WITH NON-CONDUCTIVE WOOD</text>
  <text x="46" y="48" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="500" fill="#64748b">Never touch victim directly; push wire away with dry wooden pole or shut off circuit breaker</text>
</svg>