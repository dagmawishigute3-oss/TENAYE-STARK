<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 400" width="500" height="400" style="background:#ffffff;">
  <defs>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.08"/>
    </filter>
    <linearGradient id="tealGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#14a2a8"/>
      <stop offset="100%" stop-color="#0e7c82"/>
    </linearGradient>
    <linearGradient id="scrubPants" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d6368"/>
      <stop offset="100%" stop-color="#08474b"/>
    </linearGradient>
  </defs>

  <!-- Clean Ground Baseline -->
  <line x1="40" y1="340" x2="460" y2="340" stroke="#e2e8f0" stroke-width="3" stroke-linecap="round"/>

  <!-- Main Illustration Group -->
  <g transform="translate(0, 10)">
    
  <!-- Victim seated propped up -->
  <path d="M140,240 L180,260 L240,290" fill="none" stroke="#64748b" stroke-width="20" stroke-linecap="round"/>
  <path d="M150,245 L120,180" fill="none" stroke="#e2e8f0" stroke-width="22" stroke-linecap="round"/>
  <circle cx="110" cy="145" r="22" fill="#ffedd5" stroke="#1e293b" stroke-width="2.5"/>
  <!-- Rescuer offering cool water &amp; fanning -->
  <circle cx="280" cy="130" r="24" fill="#ffedd5" stroke="#1e293b" stroke-width="2.5"/>
  <path d="M280,155 L280,245" fill="none" stroke="url(#tealGrad)" stroke-width="28" stroke-linecap="round"/>
  <path d="M280,245 L260,335 M295,245 L320,335" fill="none" stroke="url(#scrubPants)" stroke-width="12" stroke-linecap="round"/>
  <!-- Hand offering glass -->
  <path d="M270,180 L200,185 L140,170" fill="none" stroke="url(#tealGrad)" stroke-width="10" stroke-linecap="round"/>
  <rect x="135" y="160" width="14" height="20" rx="3" fill="#bae6fd" stroke="#0284c7" stroke-width="2"/>
  <!-- Fan in other hand -->
  <path d="M290,175 L330,170 L345,150" fill="none" stroke="url(#tealGrad)" stroke-width="10" stroke-linecap="round"/>
  <path d="M345,150 L370,135 L385,160 Z" fill="#fed7aa" stroke="#ea580c" stroke-width="2"/>
  <!-- Airflow lines -->
  <path d="M330,140 Q250,145 170,140 M320,155 Q245,160 170,155" fill="none" stroke="#38bdf8" stroke-width="2" stroke-linecap="round"/>

  </g>

  <!-- Professional Clinical Status Tag -->
  <rect x="25" y="20" width="14" height="14" rx="4" fill="#119197"/>
  <text x="46" y="32" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700" fill="#0f766e" letter-spacing="0.3">STAGE 2: AIR CIRCULATION &amp; HYDRATION</text>
  <text x="46" y="48" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="500" fill="#64748b">Continuously fan victim; offer small measured sips of cool water if fully conscious</text>
</svg>