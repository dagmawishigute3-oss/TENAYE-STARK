<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 400" width="500" height="400" style="background:#ffffff;">
  <defs>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.08"/>
    </filter>
    <linearGradient id="tealGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#14a2a8"/>
      <stop offset="100%" stop-color="#0e7c82"/>
    </linearGradient>
    <linearGradient id="scrubPants" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d6368"/>
      <stop offset="100%" stop-color="#08474b"/>
    </linearGradient>
  </defs>

  <!-- Clean Ground Baseline -->
  <line x1="40" y1="340" x2="460" y2="340" stroke="#e2e8f0" stroke-width="3" stroke-linecap="round"/>

  <!-- Main Illustration Group -->
  <g transform="translate(0, 10)">
    
  <!-- Multi-Rescuer Log-Roll Mechanism -->
  <!-- Victim being rolled as a single unit -->
  <circle cx="120" cy="275" r="22" fill="#ffedd5" stroke="#1e293b" stroke-width="2.5"/>
  <path d="M140,280 L320,280" fill="none" stroke="#3b82f6" stroke-width="24" stroke-linecap="round"/>
  <!-- Rigid spine alignment axis -->
  <line x1="100" y1="280" x2="350" y2="280" stroke="#f59e0b" stroke-width="4" stroke-linecap="round"/>
  <!-- Rescuer 1 at head directing -->
  <circle cx="70" cy="180" r="22" fill="#ffedd5" stroke="#1e293b" stroke-width="2.5"/>
  <path d="M70,205 L70,275" fill="none" stroke="url(#tealGrad)" stroke-width="26" stroke-linecap="round"/>
  <path d="M80,220 L105,255" fill="none" stroke="url(#tealGrad)" stroke-width="9" stroke-linecap="round"/>
  <!-- Rescuer 2 at torso/pelvis -->
  <circle cx="230" cy="150" r="22" fill="#ffedd5" stroke="#1e293b" stroke-width="2.5"/>
  <path d="M230,175 L230,250" fill="none" stroke="url(#tealGrad)" stroke-width="26" stroke-linecap="round"/>
  <path d="M220,195 L180,240 L170,270" fill="none" stroke="url(#tealGrad)" stroke-width="9" stroke-linecap="round"/>
  <path d="M240,195 L270,240 L260,270" fill="none" stroke="url(#tealGrad)" stroke-width="9" stroke-linecap="round"/>
  <!-- Roll Rotation Arrow -->
  <path d="M190,320 A 30 30 0 0 1 240,320" fill="none" stroke="#22c55e" stroke-width="3" stroke-linecap="round"/>
  <polygon points="240,315 248,322 238,327" fill="#22c55e"/>

  </g>

  <!-- Professional Clinical Status Tag -->
  <rect x="25" y="20" width="14" height="14" rx="4" fill="#119197"/>
  <text x="46" y="32" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700" fill="#0f766e" letter-spacing="0.3">STAGE 2: SYNCHRONIZED LOG-ROLL UNIT</text>
  <text x="46" y="48" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="500" fill="#64748b">Roll victim only when airway is compromised; move shoulders and hips simultaneously without twist</text>
</svg>