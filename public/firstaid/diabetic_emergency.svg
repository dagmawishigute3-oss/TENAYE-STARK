<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 400" width="500" height="400" style="background:#ffffff;">
  <defs>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.08"/>
    </filter>
    <linearGradient id="tealGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#14a2a8"/>
      <stop offset="100%" stop-color="#0e7c82"/>
    </linearGradient>
    <linearGradient id="scrubPants" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d6368"/>
      <stop offset="100%" stop-color="#08474b"/>
    </linearGradient>
  </defs>

  <!-- Clean Ground Baseline -->
  <line x1="40" y1="340" x2="460" y2="340" stroke="#e2e8f0" stroke-width="3" stroke-linecap="round"/>

  <!-- Main Illustration Group -->
  <g transform="translate(0, 10)">
    
  <!-- Victim seated conscious -->
  <path d="M150,240 L190,260 L220,335" fill="none" stroke="#64748b" stroke-width="14" stroke-linecap="round"/>
  <path d="M160,245 L130,180" fill="none" stroke="#3b82f6" stroke-width="22" stroke-linecap="round"/>
  <circle cx="120" cy="145" r="22" fill="#ffedd5" stroke="#1e293b" stroke-width="2.5"/>
  <!-- Rescuer offering glass of fruit juice / glucose drink -->
  <circle cx="270" cy="130" r="24" fill="#ffedd5" stroke="#1e293b" stroke-width="2.5"/>
  <path d="M270,155 L270,245" fill="none" stroke="url(#tealGrad)" stroke-width="28" stroke-linecap="round"/>
  <path d="M270,245 L250,335 M285,245 L310,335" fill="none" stroke="url(#scrubPants)" stroke-width="12" stroke-linecap="round"/>
  <path d="M260,175 L200,185 L150,170" fill="none" stroke="url(#tealGrad)" stroke-width="10" stroke-linecap="round"/>
  <!-- Glass with orange juice -->
  <rect x="145" y="160" width="16" height="22" rx="3" fill="#fdba74" stroke="#ea580c" stroke-width="2"/>
  <!-- 15g Rule Badge -->
  <rect x="330" y="150" width="130" height="48" rx="8" fill="#fff7ed" stroke="#f97316" stroke-width="2"/>
  <text x="340" y="170" font-size="12" font-weight="900" fill="#c2410c">THE 15-15 RULE</text>
  <text x="340" y="186" font-size="9" font-weight="600" fill="#9a3412">15g Fast-Acting Sugar</text>

  </g>

  <!-- Professional Clinical Status Tag -->
  <rect x="25" y="20" width="14" height="14" rx="4" fill="#119197"/>
  <text x="46" y="32" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700" fill="#0f766e" letter-spacing="0.3">STAGE 1: 15G FAST-ACTING SUGAR OR JUICE</text>
  <text x="46" y="48" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="500" fill="#64748b">If conscious and able to swallow, give half glass of fruit juice, soda, or 3-4 glucose tablets</text>
</svg>