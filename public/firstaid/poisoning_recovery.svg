<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 400" width="500" height="400" style="background:#ffffff;">
  <defs>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.08"/>
    </filter>
    <linearGradient id="tealGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#14a2a8"/>
      <stop offset="100%" stop-color="#0e7c82"/>
    </linearGradient>
    <linearGradient id="scrubPants" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d6368"/>
      <stop offset="100%" stop-color="#08474b"/>
    </linearGradient>
  </defs>

  <!-- Clean Ground Baseline -->
  <line x1="40" y1="340" x2="460" y2="340" stroke="#e2e8f0" stroke-width="3" stroke-linecap="round"/>

  <!-- Main Illustration Group -->
  <g transform="translate(0, 10)">
    
  <!-- Lateral Recovery Position for Poisoning -->
  <circle cx="100" cy="280" r="22" fill="#ffedd5" stroke="#1e293b" stroke-width="2.5"/>
  <!-- Body on side -->
  <path d="M120,290 L260,290" fill="none" stroke="#3b82f6" stroke-width="26" stroke-linecap="round"/>
  <!-- Bent leg stabilizer -->
  <path d="M240,290 L270,240 L310,300" fill="none" stroke="#1e293b" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Head tilted down for vomit drainage -->
  <path d="M90,295 Q80,310 70,320" fill="none" stroke="#0ea5e9" stroke-width="2" stroke-dasharray="3 3"/>
  <!-- Rescuer monitoring airway -->
  <circle cx="200" cy="160" r="24" fill="#ffedd5" stroke="#1e293b" stroke-width="2.5"/>
  <path d="M200,185 L200,260" fill="none" stroke="url(#tealGrad)" stroke-width="28" stroke-linecap="round"/>
  <path d="M200,260 L180,335 M220,260 L240,335" fill="none" stroke="url(#scrubPants)" stroke-width="12" stroke-linecap="round"/>
  <path d="M190,200 L140,230 L105,270" fill="none" stroke="url(#tealGrad)" stroke-width="10" stroke-linecap="round"/>
  <!-- Warning badge: DO NOT INDUCE VOMITING -->
  <rect x="290" y="160" width="160" height="42" rx="8" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/>
  <text x="300" y="178" font-size="11" font-weight="800" fill="#dc2626">DO NOT INDUCE VOMITING</text>
  <text x="300" y="193" font-size="9" font-weight="600" fill="#7f1d1d">Prevents chemical airway burns</text>

  </g>

  <!-- Professional Clinical Status Tag -->
  <rect x="25" y="20" width="14" height="14" rx="4" fill="#119197"/>
  <text x="46" y="32" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700" fill="#0f766e" letter-spacing="0.3">STAGE 2: LATERAL RECOVERY POSITION</text>
  <text x="46" y="48" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="500" fill="#64748b">Place on side to drain airway; never induce vomiting or give raw milk</text>
</svg>