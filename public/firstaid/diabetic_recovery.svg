<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 400" width="500" height="400" style="background:#ffffff;">
  <defs>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.08"/>
    </filter>
    <linearGradient id="tealGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#14a2a8"/>
      <stop offset="100%" stop-color="#0e7c82"/>
    </linearGradient>
    <linearGradient id="scrubPants" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d6368"/>
      <stop offset="100%" stop-color="#08474b"/>
    </linearGradient>
  </defs>

  <!-- Clean Ground Baseline -->
  <line x1="40" y1="340" x2="460" y2="340" stroke="#e2e8f0" stroke-width="3" stroke-linecap="round"/>

  <!-- Main Illustration Group -->
  <g transform="translate(0, 10)">
    
  <!-- Patient recovering seated comfortably -->
  <path d="M150,240 L190,260 L220,335" fill="none" stroke="#64748b" stroke-width="14" stroke-linecap="round"/>
  <path d="M160,245 L130,180" fill="none" stroke="#3b82f6" stroke-width="22" stroke-linecap="round"/>
  <circle cx="120" cy="145" r="22" fill="#ffedd5" stroke="#1e293b" stroke-width="2.5"/>
  <!-- Rescuer checking stopwatch / timer -->
  <circle cx="270" cy="130" r="24" fill="#ffedd5" stroke="#1e293b" stroke-width="2.5"/>
  <path d="M270,155 L270,245" fill="none" stroke="url(#tealGrad)" stroke-width="28" stroke-linecap="round"/>
  <path d="M270,245 L250,335 M285,245 L310,335" fill="none" stroke="url(#scrubPants)" stroke-width="12" stroke-linecap="round"/>
  <path d="M260,175 L220,180 L200,165" fill="none" stroke="url(#tealGrad)" stroke-width="10" stroke-linecap="round"/>
  <!-- Timer clock -->
  <circle cx="195" cy="160" r="16" fill="#ffffff" stroke="#0f766e" stroke-width="2.5"/>
  <line x1="195" y1="160" x2="195" y2="150" stroke="#0f766e" stroke-width="2"/>
  <line x1="195" y1="160" x2="202" y2="160" stroke="#0f766e" stroke-width="2"/>
  <text x="320" y="170" font-size="12" font-weight="900" fill="#0f766e">WAIT 15 MINUTES</text>
  <text x="320" y="186" font-size="9" font-weight="600" fill="#134e4a">Re-evaluate blood glucose</text>

  </g>

  <!-- Professional Clinical Status Tag -->
  <rect x="25" y="20" width="14" height="14" rx="4" fill="#119197"/>
  <text x="46" y="32" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700" fill="#0f766e" letter-spacing="0.3">STAGE 2: 15-MINUTE RE-EVALUATION</text>
  <text x="46" y="48" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="500" fill="#64748b">Wait 15 minutes; if glucose remains low or confusion persists, repeat 15g sugar or call 907</text>
</svg>