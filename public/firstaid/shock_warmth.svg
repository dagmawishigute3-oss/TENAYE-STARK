<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 400" width="500" height="400" style="background:#ffffff;">
  <defs>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.08"/>
    </filter>
    <linearGradient id="tealGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#14a2a8"/>
      <stop offset="100%" stop-color="#0e7c82"/>
    </linearGradient>
    <linearGradient id="scrubPants" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d6368"/>
      <stop offset="100%" stop-color="#08474b"/>
    </linearGradient>
  </defs>

  <!-- Clean Ground Baseline -->
  <line x1="40" y1="340" x2="460" y2="340" stroke="#e2e8f0" stroke-width="3" stroke-linecap="round"/>

  <!-- Main Illustration Group -->
  <g transform="translate(0, 10)">
    
  <!-- Supine victim with elevated legs covered in blanket -->
  <circle cx="100" cy="290" r="22" fill="#ffedd5" stroke="#1e293b" stroke-width="2.5"/>
  <path d="M120,300 L240,300" fill="none" stroke="#dc2626" stroke-width="30" stroke-linecap="round"/>
  <path d="M240,300 L340,250" fill="none" stroke="#dc2626" stroke-width="26" stroke-linecap="round"/>
  <rect x="280" y="275" width="80" height="40" rx="8" fill="#bae6fd" stroke="#0284c7" stroke-width="2"/>
  <!-- Rescuer loosening collar &amp; reassuring -->
  <circle cx="170" cy="150" r="24" fill="#ffedd5" stroke="#1e293b" stroke-width="2.5"/>
  <path d="M170,175 L170,250" fill="none" stroke="url(#tealGrad)" stroke-width="28" stroke-linecap="round"/>
  <path d="M170,250 L150,335 M190,250 L210,335" fill="none" stroke="url(#scrubPants)" stroke-width="12" stroke-linecap="round"/>
  <path d="M160,190 L125,230 L115,270" fill="none" stroke="url(#tealGrad)" stroke-width="10" stroke-linecap="round"/>
  <rect x="270" y="160" width="165" height="44" rx="8" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/>
  <text x="280" y="178" font-size="11" font-weight="800" fill="#dc2626">MAINTAIN BODY WARMTH</text>
  <text x="280" y="194" font-size="9" font-weight="600" fill="#7f1d1d">Prevent hypothermia; no food/drink</text>

  </g>

  <!-- Professional Clinical Status Tag -->
  <rect x="25" y="20" width="14" height="14" rx="4" fill="#119197"/>
  <text x="46" y="32" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700" fill="#0f766e" letter-spacing="0.3">STAGE 2: PRESERVE CORE TEMPERATURE</text>
  <text x="46" y="48" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="500" fill="#64748b">Cover with warm thermal blanket; loosen restrictive neckwear; do not give fluids</text>
</svg>