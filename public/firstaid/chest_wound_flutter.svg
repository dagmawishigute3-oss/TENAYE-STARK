<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 400" width="500" height="400" style="background:#ffffff;">
  <defs>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.08"/>
    </filter>
    <linearGradient id="tealGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#14a2a8"/>
      <stop offset="100%" stop-color="#0e7c82"/>
    </linearGradient>
    <linearGradient id="scrubPants" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d6368"/>
      <stop offset="100%" stop-color="#08474b"/>
    </linearGradient>
  </defs>

  <!-- Clean Ground Baseline -->
  <line x1="40" y1="340" x2="460" y2="340" stroke="#e2e8f0" stroke-width="3" stroke-linecap="round"/>

  <!-- Main Illustration Group -->
  <g transform="translate(0, 10)">
    
  <!-- 3-Sided Flutter Valve Seal Closeup Demonstration -->
  <rect x="120" y="100" width="180" height="180" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="3"/>
  <!-- Chest wound hole in center -->
  <circle cx="210" cy="190" r="14" fill="#ef4444" stroke="#dc2626" stroke-width="2"/>
  <!-- Plastic film covering -->
  <rect x="150" y="130" width="120" height="120" rx="6" fill="#e0f2fe" fill-opacity="0.7" stroke="#0284c7" stroke-width="2"/>
  <!-- Top tape (Taped) -->
  <rect x="140" y="125" width="140" height="14" rx="3" fill="#fbbf24" stroke="#d97706" stroke-width="1.5"/>
  <!-- Left tape (Taped) -->
  <rect x="140" y="135" width="14" height="110" rx="3" fill="#fbbf24" stroke="#d97706" stroke-width="1.5"/>
  <!-- Right tape (Taped) -->
  <rect x="266" y="135" width="14" height="110" rx="3" fill="#fbbf24" stroke="#d97706" stroke-width="1.5"/>
  <!-- Bottom Edge OPEN (UNTAPED) with green exit arrow -->
  <path d="M210,230 L210,270" fill="none" stroke="#22c55e" stroke-width="4" stroke-linecap="round"/>
  <polygon points="204,265 210,275 216,265" fill="#22c55e"/>
  <text x="165" y="295" font-size="12" font-weight="900" fill="#15803d">4TH EDGE OPEN (AIR ESCAPES)</text>

  </g>

  <!-- Professional Clinical Status Tag -->
  <rect x="25" y="20" width="14" height="14" rx="4" fill="#119197"/>
  <text x="46" y="32" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700" fill="#0f766e" letter-spacing="0.3">STAGE 2: THREE-SIDED FLUTTER VALVE DRESSING</text>
  <text x="46" y="48" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="500" fill="#64748b">Tape 3 edges securely, leaving bottom edge open as a 1-way release valve to prevent tension pneumothorax</text>
</svg>