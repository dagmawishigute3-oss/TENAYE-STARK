<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 400" width="500" height="400" style="background:#ffffff;">
  <defs>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.08"/>
    </filter>
    <linearGradient id="tealGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#14a2a8"/>
      <stop offset="100%" stop-color="#0e7c82"/>
    </linearGradient>
    <linearGradient id="scrubPants" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d6368"/>
      <stop offset="100%" stop-color="#08474b"/>
    </linearGradient>
  </defs>

  <!-- Clean Ground Baseline -->
  <line x1="40" y1="340" x2="460" y2="340" stroke="#e2e8f0" stroke-width="3" stroke-linecap="round"/>

  <!-- Main Illustration Group -->
  <g transform="translate(0, 10)">
    
  <!-- Victim lying down in shade -->
  <circle cx="110" cy="270" r="22" fill="#fed7aa" stroke="#1e293b" stroke-width="2.5"/>
  <path d="M130,280 L290,280" fill="none" stroke="#64748b" stroke-width="24" stroke-linecap="round"/>
  <!-- Ice packs on neck, armpit, groin -->
  <rect x="125" y="260" width="22" height="14" rx="3" fill="#38bdf8" stroke="#0284c7" stroke-width="2"/>
  <rect x="195" y="270" width="22" height="14" rx="3" fill="#38bdf8" stroke="#0284c7" stroke-width="2"/>
  <rect x="235" y="270" width="22" height="14" rx="3" fill="#38bdf8" stroke="#0284c7" stroke-width="2"/>
  <!-- Rescuer in Tenaye teal applying cold wet towel -->
  <circle cx="220" cy="140" r="24" fill="#ffedd5" stroke="#1e293b" stroke-width="2.5"/>
  <path d="M220,165 L220,245" fill="none" stroke="url(#tealGrad)" stroke-width="28" stroke-linecap="round"/>
  <path d="M220,245 L190,335 M240,245 L270,335" fill="none" stroke="url(#scrubPants)" stroke-width="12" stroke-linecap="round"/>
  <path d="M210,185 L160,210 L135,255" fill="none" stroke="url(#tealGrad)" stroke-width="10" stroke-linecap="round"/>
  <!-- Cool water mist / spray -->
  <path d="M150,220 Q160,235 170,250 M140,230 Q150,245 160,260" stroke="#0284c7" stroke-width="2" stroke-linecap="round" stroke-dasharray="3 3"/>
  <rect x="330" y="180" width="130" height="48" rx="8" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
  <text x="340" y="200" font-size="11" font-weight="800" fill="#15803d">AGGRESSIVE COOLING</text>
  <text x="340" y="216" font-size="9" font-weight="600" fill="#166534">Ice to neck, axilla &amp; groin</text>

  </g>

  <!-- Professional Clinical Status Tag -->
  <rect x="25" y="20" width="14" height="14" rx="4" fill="#119197"/>
  <text x="46" y="32" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700" fill="#0f766e" letter-spacing="0.3">STAGE 1: RAPID ACTIVE COOLING &amp; ICE PACKS</text>
  <text x="46" y="48" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="500" fill="#64748b">Move to shade, strip clothes, place cold wet cloths &amp; ice to neck, armpits, and groin</text>
</svg>