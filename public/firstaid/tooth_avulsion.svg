<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 400" width="500" height="400" style="background:#ffffff;">
  <defs>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.08"/>
    </filter>
    <linearGradient id="tealGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#14a2a8"/>
      <stop offset="100%" stop-color="#0e7c82"/>
    </linearGradient>
    <linearGradient id="scrubPants" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d6368"/>
      <stop offset="100%" stop-color="#08474b"/>
    </linearGradient>
  </defs>

  <!-- Clean Ground Baseline -->
  <line x1="40" y1="340" x2="460" y2="340" stroke="#e2e8f0" stroke-width="3" stroke-linecap="round"/>

  <!-- Main Illustration Group -->
  <g transform="translate(0, 10)">
    
  <!-- Knocked out tooth handled by crown only -->
  <!-- Hand wearing teal scrub glove -->
  <path d="M100,240 L160,220 L200,210" fill="none" stroke="url(#tealGrad)" stroke-width="14" stroke-linecap="round"/>
  <circle cx="205" cy="208" r="8" fill="#ffedd5" stroke="#1e293b" stroke-width="2"/>
  <!-- Tooth graphic enlarged -->
  <g transform="translate(230, 160) scale(1.6)">
    <!-- White Crown -->
    <path d="M15,10 C15,0 35,0 35,10 C35,18 30,22 25,22 C20,22 15,18 15,10 Z" fill="#ffffff" stroke="#1e293b" stroke-width="2"/>
    <!-- Yellowish Delicate Root -->
    <path d="M18,22 L17,40 M32,22 L33,40" stroke="#fef08a" stroke-width="4" stroke-linecap="round"/>
    <path d="M18,22 L17,40 M32,22 L33,40" stroke="#ca8a04" stroke-width="1.5" stroke-linecap="round"/>
  </g>
  <!-- Handle Crown Checkmark -->
  <circle cx="280" cy="165" r="14" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <path d="M273,165 L278,170 L287,160" fill="none" stroke="#16a34a" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Touch Root Cross -->
  <circle cx="280" cy="225" r="14" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>
  <path d="M274,219 L286,231 M286,219 L274,231" fill="none" stroke="#dc2626" stroke-width="2.5" stroke-linecap="round"/>

  </g>

  <!-- Professional Clinical Status Tag -->
  <rect x="25" y="20" width="14" height="14" rx="4" fill="#119197"/>
  <text x="46" y="32" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700" fill="#0f766e" letter-spacing="0.3">STAGE 1: HANDLE BY WHITE CROWN ONLY</text>
  <text x="46" y="48" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="500" fill="#64748b">Pick up tooth by enamel crown only; never touch or scrape the delicate root fibers</text>
</svg>