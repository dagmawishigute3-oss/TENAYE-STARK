<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 400" width="500" height="400" style="background:#ffffff;">
  <defs>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.08"/>
    </filter>
    <linearGradient id="tealGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#14a2a8"/>
      <stop offset="100%" stop-color="#0e7c82"/>
    </linearGradient>
    <linearGradient id="scrubPants" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d6368"/>
      <stop offset="100%" stop-color="#08474b"/>
    </linearGradient>
  </defs>

  <!-- Clean Ground Baseline -->
  <line x1="40" y1="340" x2="460" y2="340" stroke="#e2e8f0" stroke-width="3" stroke-linecap="round"/>

  <!-- Main Illustration Group -->
  <g transform="translate(0, 10)">
    
  <!-- Victim on dry ground -->
  <circle cx="110" cy="285" r="22" fill="#ffedd5" stroke="#1e293b" stroke-width="2.5"/>
  <path d="M130,295 L320,295" fill="none" stroke="#64748b" stroke-width="24" stroke-linecap="round"/>
  <!-- Rescuer delivering 5 initial rescue breaths -->
  <circle cx="130" cy="205" r="24" fill="#ffedd5" stroke="#1e293b" stroke-width="2.5"/>
  <path d="M145,225 L180,270" fill="none" stroke="url(#tealGrad)" stroke-width="28" stroke-linecap="round"/>
  <path d="M180,270 L210,335 M160,290 L180,335" fill="none" stroke="url(#scrubPants)" stroke-width="12" stroke-linecap="round"/>
  <!-- Mouth-to-mouth head-tilt seal -->
  <path d="M125,220 L115,265" fill="none" stroke="url(#tealGrad)" stroke-width="8" stroke-linecap="round"/>
  <!-- 5 Initial Breaths Badge -->
  <circle cx="70" cy="180" r="26" fill="#fee2e2" stroke="#ef4444" stroke-width="2.5"/>
  <text x="63" y="186" font-size="18" font-weight="900" fill="#dc2626">5</text>
  <text x="44" y="218" font-size="10" font-weight="800" fill="#dc2626">Rescue Breaths</text>

  </g>

  <!-- Professional Clinical Status Tag -->
  <rect x="25" y="20" width="14" height="14" rx="4" fill="#119197"/>
  <text x="46" y="32" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700" fill="#0f766e" letter-spacing="0.3">STAGE 1: 5 IMMEDIATE INITIAL RESCUE BREATHS</text>
  <text x="46" y="48" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="500" fill="#64748b">Drowning arrests are hypoxic; deliver 5 full rescue breaths first to re-oxygenate lungs</text>
</svg>